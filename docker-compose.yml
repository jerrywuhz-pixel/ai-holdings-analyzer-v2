version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-holdings-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_holdings}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_holdings}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-holdings-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile
    container_name: ai-holdings-data-service
    restart: unless-stopped
    ports:
      - "${DATA_SERVICE_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_holdings}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data-service/src:/app/src:ro
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  gbrain:
    build:
      context: ./gbrain
      dockerfile: Dockerfile
    container_name: ai-holdings-gbrain
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_holdings}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: ${GBRAIN_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./gbrain/src:/app/src:ro
    healthcheck:
      test: ["CMD", "bun", "/app/src/mcp-adapter.ts", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  webapp:
    image: node:20-alpine
    container_name: ai-holdings-webapp
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${WEBAPP_PORT:-3000}:3000"
    volumes:
      - ./webapp:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      data-service:
        condition: service_healthy
    environment:
      NODE_ENV: development

volumes:
  postgres_data:
  redis_data:
